<body>
  <header><div class="wrap"><div><div class="eyebrow">POINT BANK · 抽獎匯入版 5.9</div><div class="brand" id="brand">點數銀行</div></div><div class="actions nav" id="nav" style="margin:0"></div></div></header>
  <div id="notifyPanel" class="notify-panel" role="dialog" aria-label="通知" hidden></div>
  <div id="message" class="banner" role="status" aria-live="polite" hidden></div>
  <main class="wrap" id="app"><div class="loading">正在連接點數銀行…</div></main>
  <footer id="appFooter" class="app-footer" hidden></footer>
  <dialog id="imagePreview" class="image-preview" aria-labelledby="previewTitle" aria-describedby="previewHint">
    <div class="preview-shell">
      <div class="preview-header"><h2 id="previewTitle">圖片預覽</h2><span id="previewCount" class="muted small"></span><button type="button" class="secondary" data-action="previewClose" autofocus>關閉 ✕</button></div>
      <div class="preview-toolbar"><button type="button" id="previewPrev" class="secondary" data-action="previewPrev">上一張</button><button type="button" id="previewNext" class="secondary" data-action="previewNext">下一張</button><button type="button" id="previewZoomOut" class="secondary" data-action="previewZoomOut" aria-label="縮小圖片">－</button><output id="previewScale" aria-live="polite">—</output><button type="button" id="previewZoomIn" class="secondary" data-action="previewZoomIn" aria-label="放大圖片">＋</button><button type="button" id="previewFit" class="secondary" data-action="previewFit">符合視窗</button><button type="button" id="previewActual" class="secondary" data-action="previewActual">原始大小</button><button type="button" id="previewDownload" class="secondary" data-action="downloadAttachment">下載原檔</button></div>
      <p id="previewStatus" class="preview-status" role="status" aria-live="polite">準備載入圖片…</p>
      <div id="previewStage" class="preview-stage" hidden><div class="preview-canvas"><img id="previewImage" class="preview-image" alt="附件圖片" draggable="false"></div></div>
      <p id="previewHint" class="preview-hint">放大後可拖曳圖片或捲動查看；雙擊切換原始大小／符合視窗。鍵盤 ← → 切換，＋／－縮放，Esc 關閉。</p>
    </div>
  </dialog>
  <dialog id="pointStats" class="stats-dialog" aria-labelledby="pointStatsTitle"><div class="stats-dialog-header"><h2 id="pointStatsTitle">學生點數統計與獎品參考</h2><button type="button" class="secondary" data-action="closePointStats" autofocus>關閉 ✕</button></div><div id="pointStatsBody" class="stats-dialog-body"></div></dialog>
  <dialog id="submissionProgress" class="submission-progress" aria-labelledby="submissionTitle"><section><div class="eyebrow muted">POINT BANK · 收件進度</div><h1 id="submissionTitle">正在保存申請</h1><p id="submissionDetail" role="status" aria-live="polite"></p><progress id="submissionBar" max="1" value="0"></progress><p id="submissionCounter" class="muted"></p><p id="submissionElapsed" role="timer">已等待 0 秒</p><p id="submissionEstimate" class="muted small" aria-live="polite"></p><p id="submissionReceipts" class="file-note"></p><p class="muted small">附件尚未完整上傳前，請暫時保留此頁面，避免中斷傳送。已保存的內容可在收件進度找回，請勿重複建立相同申請。</p></section></dialog>
  <dialog id="recordEditDialog" class="stats-dialog record-edit-dialog" aria-labelledby="recordEditTitle"><div class="stats-dialog-header"><h2 id="recordEditTitle">修改審核中的申請</h2><button type="button" class="secondary" data-action="closeRecordEdit">關閉 ✕</button></div><div id="recordEditBody" class="stats-dialog-body"></div></dialog>
  <dialog id="receiptDialog" class="stats-dialog" aria-labelledby="receiptTitle"><div class="stats-dialog-header"><h2 id="receiptTitle">收件進度</h2><button type="button" class="secondary" data-action="receiptClose" autofocus>關閉 ✕</button></div><div id="receiptBody" class="stats-dialog-body"></div></dialog>
  <dialog id="scratchDialog" class="stats-dialog scratch-dialog" aria-labelledby="scratchTitle"><div class="stats-dialog-header"><h2 id="scratchTitle">刮刮樂</h2><button type="button" class="secondary" data-action="scratchClose">關閉 ✕</button></div><div id="scratchBody" class="stats-dialog-body"></div></dialog>
  <script>
  'use strict';
  const $ = id => document.getElementById(id);
  const state = {config:{name:'點數銀行',register:true},token:'',me:null,home:null,detail:null,authTab:'login',passwordView:false,busy:false,search:'',sortMode:'classAsc',pointStats:{className:'',includeInactive:false,threshold:''},studentId:null,reviewId:null,submitKey:null,adjustKey:null,view:'home',queueFilter:'',queueClass:'',queueCategory:'',queueStatus:'pending',queueSelected:[],batchNote:'',batchWaive:false,receiptSearch:'',receiptState:'',scratchView:null,detailScratchKey:null,lottery:null,lotterySel:[],lotteryPicks:{},lotteryShow:'pending',lotteryDates:{from:'',to:'',before:''},teacherTab:'',reviewFrom:'',history:null,historyFilter:{className:'',studentId:'',status:''},resuming:false,submissionSent:false,pointDrafts:[],draftCounter:0,stagedSending:false,receiptView:null};
  try { state.token = sessionStorage.getItem('pbToken') || ''; } catch (_) {}
  const esc = value => String(value ?? '').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
  function notify(text,error=false){$('message').textContent=text;$('message').className='banner'+(error?' error':'');$('message').hidden=!text;}
  function setToken(token){state.token=token;try{token?sessionStorage.setItem('pbToken',token):sessionStorage.removeItem('pbToken');}catch(_){} }
  /* v5.8：在 Google 的 GAS 頁面照舊用 google.script.run；放在其他網站（GitHub Pages）時改用 fetch 呼叫同一個 API（doPost）。
     fetch 用 text/plain 避免 CORS 預檢，credentials:'omit' 不帶 Google 登入資料，所以手機登入多個 Google 帳號也能使用。 */
  const PB_API_URL='https:'+'/'+'/'+'script.google.com/macros/s/AKfycbwCG0CBw7-S0ld5GXO156r9vPPKRsvtAKG9wgNarn_bc0S3CgVIkMPjalcAcq2kwatf/exec';
  const PB_FETCH_TIMEOUT=120000;
  function onGasPage(){try{const g=window.google;return Boolean(g&&g.script&&g.script.run);}catch(_){return false;}}
  function rpc(action,input={}){return onGasPage()?gasRpc(action,input):fetchRpc(action,input);}
  function gasRpc(action,input){return new Promise((resolve,reject)=>{window.google.script.run.withSuccessHandler(r=>r&&r.ok?resolve(r.data):reject(new Error(r?.message||'伺服器回應異常。'))).withFailureHandler(e=>reject(new Error(e.message||'連線失敗，請稍後再試。'))).pointBankApi(action,input,state.token);});}
  function fetchRpc(action,input){
    if(typeof fetch!=='function')return Promise.reject(new Error('瀏覽器版本太舊，請更新後再試。'));
    const ctrl=typeof AbortController==='function'?new AbortController():null,timer=ctrl?setTimeout(()=>ctrl.abort(),PB_FETCH_TIMEOUT):0;
    return fetch(PB_API_URL,{method:'POST',headers:{'Content-Type':'text/plain;charset=utf-8'},body:JSON.stringify({action,input,token:state.token}),credentials:'omit',redirect:'follow',signal:ctrl?ctrl.signal:undefined})
      .then(res=>res.text(),e=>{throw new Error(e&&e.name==='AbortError'?'連線逾時，請稍後再試。':'連線失敗，請稍後再試。');})
      .then(text=>{let r;try{r=JSON.parse(text);}catch(_){throw new Error('伺服器回應異常，請稍後再試。');}if(r&&r.ok)return r.data;throw new Error(r?.message||'伺服器回應異常。');})
      .finally(()=>{if(timer)clearTimeout(timer);});
  }
  async function task(fn){if(state.busy)return;state.busy=true;notify('處理中…');document.querySelectorAll('button,input,select,textarea').forEach(c=>{if(!c.disabled){c.dataset.busyDisabled='1';c.disabled=true;}});try{await fn();}catch(e){notify(e.message,true);}finally{state.busy=false;document.querySelectorAll('[data-busy-disabled]').forEach(c=>{c.disabled=false;delete c.dataset.busyDisabled;});if(state.me?.role==='學生'&&$('pointDraftList'))updatePointBatchButtons();}}
  function key(){if(!window.crypto?.getRandomValues)throw new Error('瀏覽器不支援安全亂數，請更新 Chrome、Edge 或 Safari。');const bytes=new Uint8Array(18);crypto.getRandomValues(bytes);return Array.from(bytes,b=>b.toString(16).padStart(2,'0')).join('');}
  function today(){return new Intl.DateTimeFormat('en-CA',{timeZone:'Asia/Taipei',year:'numeric',month:'2-digit',day:'2-digit'}).format(new Date());}
  function badge(s){return `<span class="badge ${s==='已核准'?'approved':['待審核','需補件'].includes(s)?'pending':['已退回','已作廢'].includes(s)?'rejected':''}">${esc(s)}</span>`;}
  function pwMin(){return Number(state.config.passwordMin)||4;}
  function field(label,id,type='text',value='',extra=''){return `<label for="${id}">${label}</label><input id="${id}" type="${type}" value="${esc(value)}" ${extra}>`;}
  function stats(summary){return `<div class="stats"><div class="stat"><span>累積總點數</span><strong>${esc(summary.total)}</strong></div><div class="stat"><span>待審核筆數</span><strong>${esc(summary.pending)}</strong></div><div class="stat"><span>全部紀錄</span><strong>${esc(summary.count)}</strong></div></div>`;}
  function clearLogin(){closeNotifications();if($('scratchDialog')?.open)$('scratchDialog').close();state.scratchView=null;state.detailScratchKey=null;state.lottery=null;state.lotterySel=[];state.lotteryPicks={};state.lotteryShow='pending';state.lotteryDates={from:'',to:'',before:''};state.teacherTab='';state.queueClass='';state.queueCategory='';state.queueStatus='pending';state.queueSelected=[];state.batchNote='';state.batchWaive=false;state.receiptSearch='';state.receiptState='';state.history=null;state.historyFilter={className:'',studentId:'',status:''};state.reviewFrom='';state.recordEdit=null;if($('recordEditDialog')?.open)$('recordEditDialog').close();state.classroom=null;state.pointGroups=[];state.formSettingsOpen=false;state.studentTab='weekly';state.weeklyTerm='';state.academicEditor=null;state.academicEditorOpen=false;if($('receiptDialog')?.open)closeReceiptView();state.stagedSending=false;stopSubmissionClock();if($('submissionProgress')?.open)$('submissionProgress').close();state.pointDrafts=[];if($('pointStats')?.open)closePointStats();state.pointStats={className:'',includeInactive:false,threshold:''};state.sortMode='classAsc';if($('imagePreview')?.open)closeImagePreview();setToken('');state.me=null;state.home=null;state.detail=null;state.studentId=null;state.passwordView=false;state.submitKey=null;state.adjustKey=null;state.view='home';state.queueFilter='';state.resuming=false;state.submissionSent=false;}
  function renderNav(){const me=state.me;renderFooter();$('nav').innerHTML=me?`${bellHtml()}<span class="small">${esc(me.name)} · ${esc(me.role)}</span><button class="secondary" data-action="refresh">重新整理</button><button class="secondary" data-action="password">更換密碼</button><button class="secondary" data-action="logout">登出</button>`:'';}
  function acceptSnapshot(snapshot){state.config=snapshot.config||state.config;state.me=snapshot.me;state.home=snapshot.home||null;state.detail=snapshot.detail||null;}
  async function load(){acceptSnapshot(await rpc('dashboard',{studentId:state.view==='home'?state.studentId:null}));state.academicEditor=null;state.submitKey=null;state.resuming=false;state.submissionSent=false;render();}
  function render(){ $('brand').textContent=state.config.name;renderNav();if(!state.me){renderAuth();return;}if(state.me.mustChange||state.passwordView){renderPassword();return;}if(state.me.role==='學生')renderStudent();else if(state.view==='classroom')renderClassroom();else{if(state.view==='queue'){state.view='home';state.teacherTab='queue';}renderTeacher();}}
  function renderAuth(){const register=state.authTab==='register'&&state.config.register;$('app').innerHTML=`<section class="card auth"><div class="eyebrow muted">每一份努力，都值得存下來</div><h1>${register?'建立學生帳號':'歡迎回到點數銀行'}</h1><p class="muted">${register?(state.config.requireCode===false?'填寫班級、姓名與登入帳密，建立自己的點數存摺。':'向教師取得註冊碼，建立自己的點數存摺。'):'學生與教師使用同一個入口登入。'}</p><form id="auth-form">${register?field('班級','className','text','','required maxlength="40" autocomplete="organization"')+field('座號','number','text','','required maxlength="12"')+field('姓名','name','text','','required maxlength="40" autocomplete="name"')+(state.config.attendance?.enabled?field(esc(termName(state.config.attendance.current))+'出席堂數（每週）','attendance','number','',`required min="${state.config.attendance.min}" max="${state.config.attendance.max}" step="1" inputmode="numeric"`)+'<p class="muted small">請依教師說明填寫本學期每週的出席堂數（整數），目前不影響點數。</p>':'')+(state.config.requireCode===false?'':field('學生註冊碼','code','text','','required autocomplete="off"')):''}${field('登入帳號','username','text','','required minlength="4" maxlength="32" pattern="[A-Za-z0-9_-]{4,32}" autocomplete="username" autocapitalize="none"')}<p class="muted small">4–32 位英數字、底線或減號，不分大小寫。</p>${field('密碼','password','password','',`required ${register?'minlength="'+pwMin()+'" maxlength="72" autocomplete="new-password"':'autocomplete="current-password"'}`)}${register?field('再次輸入密碼','passwordConfirm','password','','required minlength="'+pwMin()+'" maxlength="72" autocomplete="new-password"'):''}<p class="muted small">${register?'至少 '+pwMin()+' 字。忘記密碼時由教師重設。':'忘記密碼？請直接聯絡教師協助重設。'}</p><div class="actions"><button type="submit">${register?'建立帳號':'登入'}</button>${state.config.register?`<button type="button" class="secondary" data-action="authTab">${register?'返回登入':'學生註冊'}</button>`:''}</div></form></section>`;}
  function renderPassword(){$('app').innerHTML=`<section class="card auth"><h1>更換密碼</h1><p class="muted">${state.me.mustChange?'你正在使用臨時密碼，請先設定自己的新密碼。':'更新後會登出所有已登入的裝置。'}</p><form id="password-form">${field('目前密碼','oldPassword','password','','required autocomplete="current-password"')}${field('新密碼（至少 '+pwMin()+' 字）','newPassword','password','','required minlength="'+pwMin()+'" maxlength="72" autocomplete="new-password"')}${field('再次輸入新密碼','confirmPassword','password','','required minlength="'+pwMin()+'" maxlength="72" autocomplete="new-password"')}<div class="actions"><button type="submit">更新密碼</button>${state.me.mustChange?'':'<button type="button" class="secondary" data-action="cancelPassword">返回</button>'}</div></form></section>`;}
  /* v5.4：老師還沒處理（待審核、處理中）的申請，學生可自行修改點數／週次／說明或刪除。 */
  const STUDENT_DELETED='學生自行刪除';
  function studentEditable(r){return ['待審核','處理中'].includes(r['審核狀態'])&&r['項目ID']!=='TEACHER_ADJUST';}
  function recordOwnerActions(r){return studentEditable(r)?`<div class="record-actions"><button type="button" class="secondary" data-action="editRecord" data-id="${esc(r['紀錄ID'])}">修改</button><button type="button" class="secondary" data-action="deleteRecord" data-id="${esc(r['紀錄ID'])}">刪除</button></div>`:'';}
  function teacherNoteHtml(r){if(!r['教師備註'])return '';return r['審核狀態']==='已作廢'&&r['教師備註']===STUDENT_DELETED?'<div class="muted">學生已自行刪除</div>':`<div class="muted">教師：${esc(r['教師備註'])}</div>`;}
  function recordsTable(records,teacher=false){if(!records.length)return '<div class="empty">目前還沒有點數紀錄。</div>';return `<div class="table-scroll"><table><thead><tr><th>週次起始日</th><th>項目</th><th>申請／核定</th><th>狀態</th><th>說明與教師回覆</th>${teacher?'<th>操作</th>':''}</tr></thead><tbody>${records.map(r=>`<tr><td>${esc(r['週次起始日'])}${(teacher?weekFullText(r):r.calendar?academicLabel(r.calendar):'')?`<br><span class="small muted">${esc(teacher?weekFullText(r):academicLabel(r.calendar))}</span>`:''}</td><td>${esc(r['項目名稱快照'])}</td><td>${esc(r['申請點數'])} / ${r['核定點數']===''?'—':esc(r['核定點數'])}</td><td>${badge(r['審核狀態'])}${teacher?'':recordOwnerActions(r)}</td><td class="note">${esc(r['學生說明'])}${attachmentHtml(r,teacher)}${teacherNoteHtml(r)}</td>${teacher?`<td><button class="secondary" data-action="review" data-id="${esc(r['紀錄ID'])}">審核／修改</button></td>`:''}</tr>`).join('')}</tbody></table></div>`;}
  function renderStudent(){restorePointProgress();const h=state.home,s=h.student;$('app').innerHTML=`<div class="hero"><div class="muted">${esc(s['班級'])} · ${esc(s['座號'])} 號</div><h1>${esc(s['姓名'])}的點數存摺</h1><p class="muted">總點數只計入教師已核准的紀錄。</p></div>${stats(h.summary)}${studentScratchHtml(h)}${attendanceMissing()?`<section class="card attention"><h2>請先填寫本學期出席堂數（每週）</h2>${attendanceFormHtml(h.attendance,'儲存出席堂數')}</section>`:''}<section class="card"><h2>存入本週的努力</h2>${pointBatchFormHtml(h)}</section><section class="card"><h2>我的個人頁面</h2><p>${esc(s['班級'])} / ${esc(s['座號'])} 號 / ${esc(s['姓名'])}</p><p class="muted small">姓名、班級與座號如需更正，請聯絡教師。</p>${h.attendance&&h.attendance.value!==null?`<details><summary>${esc(termName(h.attendance))}出席堂數（每週）：${esc(h.attendance.value)} 堂（點此修改）</summary>${attendanceFormHtml(h.attendance,'更新出席堂數')}</details>`:''}<form id="profile-form"><label for="bio">個人介紹</label><textarea id="bio" maxlength="500">${esc(s['個人介紹'])}</textarea><div class="actions"><button type="submit" class="secondary">儲存個人介紹</button></div></form><details><summary>忘記舊帳號？申請連結原有點數</summary><p class="muted">教師確認後，新帳號與這裡的點數會併入原有資料，之後需重新登入。</p><form id="link-form">${field('原班級','linkClass','text',s['班級'],'required maxlength="40"')}${field('原座號','linkNumber','text',s['座號'],'required maxlength="12"')}${field('原姓名','linkName','text',s['姓名'],'required maxlength="40"')}<label for="linkNote">說明</label><textarea id="linkNote" required maxlength="1000" placeholder="例如：原帳號忘記密碼，老師可協助確認身分"></textarea><div class="actions"><button type="submit" class="secondary">送出連結申請</button></div></form></details>${h.links.length?`<details><summary>連結申請紀錄（${h.links.length}）</summary>${h.links.map(r=>`<p>${badge(r['處理狀態'])} ${esc(r['教師備註']||'等候教師處理')}</p>`).join('')}</details>`:''}</section>${studentTabsHtml(h)}`;}
  function termName(t){return t.schoolYear+' 學年度'+(Number(t.semester)===2?'下':'上')+'學期';}
  function attendanceFormHtml(a,label){const range=state.config.attendance||{min:1,max:200};return `<form id="attendance-form">${field(esc(termName(a))+'出席堂數（每週）','attendanceValue','number',a.value??'',`required min="${range.min}" max="${range.max}" step="1" inputmode="numeric"`)}<p class="muted small">請依教師說明填寫本學期每週的出席堂數（整數），每學期填一次。此資料是為了日後公平計算，目前不影響點數。</p><div class="actions"><button type="submit">${label}</button></div></form>`;}
  const STUDENT_TABS=[['weekly','週次點數總覽'],['records','點數明細'],['receipts','收件紀錄']];
  function studentTabsHtml(h){
    const active=STUDENT_TABS.some(([k])=>k===state.studentTab)?state.studentTab:'weekly',hide=k=>k===active?'':'hidden';
    const tabs=`<div class="student-tabs" role="tablist" aria-label="我的紀錄">${STUDENT_TABS.map(([k,label])=>`<button type="button" role="tab" id="studentTab-${k}" aria-controls="studentPanel-${k}" aria-selected="${k===active}" class="${k===active?'':'secondary'}" data-action="studentTab" data-id="${k}">${label}${k==='records'?`（${h.records.length}）`:''}</button>`).join('')}</div>`;
    return tabs+`<div id="studentPanel-weekly" role="tabpanel" aria-labelledby="studentTab-weekly" ${hide('weekly')}><section class="card"><h2>週次點數總覽</h2><div id="weeklyOverview">${weeklyOverviewHtml(h)}</div></section></div><div id="studentPanel-records" role="tabpanel" aria-labelledby="studentTab-records" ${hide('records')}><section class="card"><h2>點數明細</h2>${recordsTable(h.records)}</section></div><div id="studentPanel-receipts" role="tabpanel" aria-labelledby="studentTab-receipts" ${hide('receipts')}>${receiptPanelHtml()}</div>`;
  }
  /* 切換頁籤只改顯示狀態，不重新 render，避免未儲存的個人介紹等輸入被清掉。 */
  function switchStudentTab(tab){
    if(!STUDENT_TABS.some(([k])=>k===tab))return;state.studentTab=tab;
    for(const [k] of STUDENT_TABS){const button=$('studentTab-'+k),panel=$('studentPanel-'+k);if(!button||!panel)continue;const on=k===tab;button.className=on?'':'secondary';button.setAttribute('aria-selected',String(on));panel.hidden=!on;}
  }
  const termKey=t=>t.schoolYear+'-'+t.semester;
  function weeklyTermChoice(terms){
    const t=today(),current=academicCurrentClient(),wanted=state.weeklyTerm||termKey(current);
    return terms.find(term=>termKey(term)===wanted)||[...terms].filter(term=>term.firstMonday<=t).sort((a,b)=>b.firstMonday.localeCompare(a.firstMonday))[0]||terms[0];
  }
  /* 已收件的週次快照優先；以日期提交的舊紀錄依所選學期的第一週換算，只用於顯示，不回寫紀錄。 */
  function weeklyRecordWeek(r,term,mondays){
    if(r.calendar)return Number(r.calendar.schoolYear)===term.schoolYear&&Number(r.calendar.semester)===term.semester&&Number(r.calendar.weekNumber)<=mondays.length?Number(r.calendar.weekNumber):0;
    return mondays.indexOf(String(r['週次起始日']))+1;
  }
  function weeklyOverviewHtml(h){
    const academic=state.config.academic,terms=academic?.enabled?academic.terms||[]:[];
    if(!terms.length)return '<p class="muted spacer">教師尚未設定學期週次，暫時無法依週次統計；每筆紀錄仍可在「點數明細」查看。</p>';
    const term=weeklyTermChoice(terms),label=t=>t.schoolYear+' 學年度'+(Number(t.semester)===2?'下學期':'上學期'),end=academicEnd(term.schoolYear,term.semester),start=Number(term.semester)===2?(term.schoolYear+1912)+'-02-01':(term.schoolYear+1911)+'-08-01';
    const mondays=[];for(let w=1;w<=(academic.maxWeeks||21);w++){const m=academicMonday(term.firstMonday,w);if(!m||m>end)break;mondays.push(m);}
    const columns=(h.categories||[]).map(c=>({id:c['項目ID'],name:c['項目名稱']})),cells={},pendingStates=['處理中','待審核','需補件'];let outside=0;
    for(const r of h.records){
      const week=weeklyRecordWeek(r,term,mondays),id=r['項目ID'];
      if(!week){const d=String(r['週次起始日']);if(!r.calendar&&d>=start&&d<=end)outside++;continue;}
      if(!columns.some(c=>c.id===id))columns.push({id,name:id==='TEACHER_ADJUST'?'教師調整':r['項目名稱快照']||id});
      const cell=cells[week+'|'+id]||={approved:0,hasApproved:false,pending:0};
      if(r['審核狀態']==='已核准'){cell.approved+=Number(r['核定點數'])||0;cell.hasApproved=true;}else if(pendingStates.includes(r['審核狀態']))cell.pending++;
    }
    const adjust=columns.findIndex(c=>c.id==='TEACHER_ADJUST');if(adjust>=0)columns.push(columns.splice(adjust,1)[0]);
    const num=n=>n<0?`<span class="neg">${n}</span>`:String(n),t=today(),colTotal={};let grand=0;

  function setupScratchCanvas(){

  function lotteryChange(t){

    const now=Date.now();$('submissionElapsed').textContent='已等待 '+Math.floor((now-submissionClock.started)/1000)+' 秒';
    const profile=submissionClock.profile,buckets=[submissionClock.bucket,...submissionClock.queue];
    if(!buckets.length||buckets.some(b=>!b||!profile[b])){$('submissionEstimate').textContent='正在依實際進度處理；相近資料足夠後會顯示預估剩餘時間。';return;}
    const elapsed=now-submissionClock.phaseStarted,low=Math.max(0,buckets.reduce((n,b)=>n+profile[b].lowMs,0)-elapsed),high=Math.max(0,buckets.reduce((n,b)=>n+profile[b].highMs,0)-elapsed);
    $('submissionEstimate').textContent=high<=0?'目前處理較久，正在等待伺服器確認。':'預估還需約 '+Math.max(1,Math.ceil(low/1000))+'～'+Math.max(1,Math.ceil(high/1000))+' 秒（依近期處理時間估算，實際受網路影響）';
  }
  function startSubmissionClock(){stopSubmissionClock();Object.assign(submissionClock,{started:Date.now(),phaseStarted:Date.now(),bucket:null,queue:[],profile:state.config.timing||{}});submissionClock.timer=setInterval(tickSubmissionClock,1000);tickSubmissionClock();}
  function stopSubmissionClock(){if(submissionClock.timer){clearInterval(submissionClock.timer);submissionClock.timer=0;}}
  async function callSubmission(action,p,queue=[]){
    submissionClock.bucket=['receiveBatch','uploadEvidence'].includes(action)?timingBucket(action,p):null;submissionClock.queue=queue;submissionClock.phaseStarted=Date.now();tickSubmissionClock();
    const data=await stagedRpc(action,p);if(data.telemetry){state.config.timing=data.telemetry.profile||{};submissionClock.profile=state.config.timing;}return data;
  }
  function progressStorageKey(){return state.me?.id?'pbProgress41:'+state.me.id:null;}
  function savePointProgress(){
    const name=progressStorageKey();if(!name)return;
    try{const drafts=state.pointDrafts.filter(d=>d.status!=='saved'&&(d.payload||d.receiptNo)).map(d=>{const copy={...d};delete copy.files;return copy;});drafts.length?sessionStorage.setItem(name,JSON.stringify(drafts)):sessionStorage.removeItem(name);}catch(e){/* 儲存空間不可用不影響後端收件；原頁識別碼仍保留。 */}
  }
  function restorePointProgress(){
    if(state.pointDrafts.length)return;const name=progressStorageKey();if(!name)return;
    try{const saved=JSON.parse(sessionStorage.getItem(name)||'[]');if(!Array.isArray(saved)||saved.length>10)return;state.pointDrafts=saved.filter(d=>d&&d.key).map(d=>({...d,id:'d'+(++state.draftCounter),files:[],status:'unknown',locked:!d.receiptNo,resumeOnly:Boolean(d.receiptNo),message:'已恢復原提交識別碼；請先重試核對進度，缺少的附件需重新選檔。'}));}catch(e){}
  }
  function startSupplementDraft(recordId){
    const r=state.home.records.find(r=>r['紀錄ID']===recordId);if(!r?.supplementRequest){notify('補件要求已變更，請更新資料後再試。',true);return;}
    if(state.pointDrafts.some(d=>d.originalRecordId===recordId&&d.supplementRequestId===r.supplementRequest.id)){notify('這筆補件已在申請表中。');$('points-form').scrollIntoView({behavior:'smooth'});return;}
    if(state.pointDrafts.length===1&&!state.pointDrafts[0].touched&&!state.pointDrafts[0].payload&&!state.pointDrafts[0].resumeOnly)state.pointDrafts=[];
    if(state.pointDrafts.length>=10){notify('請先送出或收起部分申請。',true);return;}
    const d=newPointDraft();Object.assign(d,{dateMode:'date',originalCalendar:r.calendar||null,originalRecordId:recordId,supplementRequestId:r.supplementRequest.id,week:r['週次起始日'],categoryId:r['項目ID'],points:String(r['申請點數']),note:r['學生說明'],resumeOnly:true,touched:true,message:r.supplementRequest.note||'請提供佐證附件後重新送審。'});state.pointDrafts.push(d);renderPointDrafts();$('points-form').scrollIntoView({behavior:'smooth'});
  }
  function pendingUploadBuckets(drafts,excludeId){return drafts.flatMap(d=>(d.serverFiles||d.payload?.files||[]).filter(f=>f.status!=='已完成'&&(excludeId===undefined||f.id!==excludeId)).map(f=>timingBucket('uploadEvidence',{file:f})));}
  async function submitPointDrafts(){
    if(!state.config.staged)throw new Error('請教師完成 v4.0 程式、資訊清單與 upgradePointBankV4 升級後再提交。');
    const drafts=state.pointDrafts.filter(d=>d.status!=='saved'),groups=new Map(),numbers=new Set(),heads=new Map();
    state.stagedSending=true;$('submissionProgress').showModal();startSubmissionClock();
    try{
      setSubmissionProgress('正在檢查附件','檢查檔案大小與內容，尚未確認收件。',0,0,[]);
      await prepareStagedDrafts(drafts);
      const newKey=key();drafts.filter(d=>!d.receiptNo).forEach(d=>{d.intakeKey=d.intakeKey||newKey;if(!groups.has(d.intakeKey))groups.set(d.intakeKey,[]);groups.get(d.intakeKey).push(d);});
      savePointProgress();
      for(const [batchKey,items]of groups){
        items.forEach(d=>{d.locked=true;d.status='sending';});
        try{
          setSubmissionProgress('正在保存申請','保存申請內容與附件清單，取得可追查的收件編號。',0,0,[...numbers]);
          const response=await callSubmission('receiveBatch',{batchKey:batchKey,entries:items.map(d=>d.payload)},[...[...groups].slice([...groups.keys()].indexOf(batchKey)+1).map(([,entries])=>timingBucket('receiveBatch',{entries})),...pendingUploadBuckets(drafts)]);
          if(response.preflightFailed){applyPointBatchResult(items,response);items.forEach(d=>{if(!d.locked)d.intakeKey=null;});savePointProgress();continue;}
          const receipt=response.receipt;acceptReceipt(receipt);heads.set(receipt.receiptNo,receipt);numbers.add(receipt.receiptNo);
          items.forEach(d=>{const item=receipt.items.find(i=>i.key===d.key);if(!item)throw new Error('收件結果缺少申請，請保留原內容重試。');d.receiptNo=receipt.receiptNo;syncStagedDraft(d,item);});savePointProgress();
        }catch(e){markPointBatchUnknown(items,e.message);savePointProgress();}
      }
      for(const d of drafts.filter(d=>d.receiptNo&&d.status!=='saved')){
        try{
          if(!heads.has(d.receiptNo)){setSubmissionProgress('正在核對原收件','以原收件編號確認已保存的進度。',0,0,[...numbers]);heads.set(d.receiptNo,await callSubmission('receiptStatus',{receiptNo:d.receiptNo}));}
          const receipt=heads.get(d.receiptNo);acceptReceipt(receipt);const item=receipt.items.find(i=>i.key===d.key);if(!item)throw new Error('找不到原申請。');syncStagedDraft(d,item);numbers.add(d.receiptNo);
        }catch(e){d.status='error';d.message=e.message;}
      }
      const count=()=>({total:drafts.reduce((n,d)=>n+(d.serverFiles||[]).length,0),done:drafts.reduce((n,d)=>n+(d.serverFiles||[]).filter(f=>f.status==='已完成').length,0)});
      let c=count();setSubmissionProgress(numbers.size?'已取得收件編號':'尚未確認收件',numbers.size?'接著傳送尚未完成的附件。':'請依各筆提示修正或以原內容重試。',c.done,c.total,[...numbers]);
      for(const d of drafts.filter(d=>d.receiptNo&&d.status==='sending')){
        try{
          const local=[];for(const file of d.files)local.push({file:file,meta:await readFileManifest(file)});
          for(const expected of d.serverFiles.filter(f=>f.status!=='已完成')){
            const source=local.find(x=>x.meta.name===expected.name&&x.meta.size===expected.size&&x.meta.digest===expected.digest);if(!source)throw new Error('請選回原附件補傳：'+expected.name);
            c=count();setSubmissionProgress('正在上傳附件',expected.name+'（每個完成後都會保存進度）',c.done,c.total,[...numbers]);
            const file=(await readUploadFiles([source.file]))[0];const response=await callSubmission('uploadEvidence',{attachmentId:expected.id,file:file},pendingUploadBuckets(drafts,expected.id));
            applyRecordResult(response);expected.status=response.record.attachments.find(a=>a.id===expected.id)?.status||expected.status;
            if(response.receipt){heads.set(d.receiptNo,response.receipt);acceptReceipt(response.receipt);syncStagedDraft(d,response.receipt.items.find(i=>i.key===d.key));}
            else if(response.record.processing?.state==='已完成')syncStagedDraft(d,{record:response.record,files:d.serverFiles,state:'已完成'});
            savePointProgress();c=count();setSubmissionProgress('附件進度已保存','正在處理剩餘附件。',c.done,c.total,[...numbers]);
          }
          if(d.status!=='saved'){const receipt=heads.get(d.receiptNo);const item=receipt?.items.find(i=>i.key===d.key);if(item)syncStagedDraft(d,item);}
          if(d.status!=='saved'){d.status='error';d.message='內容已保存，尚待伺服器檢核；可在收件進度更新或檢核。';}
        }catch(e){
          // 只在異常時核對一次，成功回應不增加查詢。無法核對時仍保留原識別碼。
          try{const receipt=await callSubmission('receiptStatus',{receiptNo:d.receiptNo});acceptReceipt(receipt);syncStagedDraft(d,receipt.items.find(i=>i.key===d.key));}catch(checkError){}
          if(d.status!=='saved'){d.status='error';d.message=e.message;d.locked=false;d.resumeOnly=true;d.expectedFiles=(d.serverFiles||[]).filter(f=>f.status!=='已完成').map(f=>f.name);d.payload=null;}
          savePointProgress();
        }
      }
      const remaining=drafts.filter(d=>d.status!=='saved').length,completed=drafts.filter(d=>d.outcome==='已完成').length,other=drafts.length-remaining-completed;
      if(!remaining)state.pointDrafts=[];savePointProgress();renderStudent();
      notify(remaining?'已完整收件 '+completed+' 筆；尚未完成 '+remaining+' 筆。請查看各筆提示，沿用原申請重試。':other?'完整收件 '+completed+' 筆；另有 '+other+' 筆已取消、轉補件或已由教師處理，請查看點數明細。':'申請已完整收件，等待教師審核。',Boolean(remaining||other));
    }finally{savePointProgress();stopSubmissionClock();state.stagedSending=false;if($('submissionProgress').open)$('submissionProgress').close();}
  }
  $('submissionProgress').addEventListener('cancel',e=>{if(state.stagedSending)e.preventDefault();});
  $('scratchDialog').addEventListener('close',()=>{if(state.scratchView)closeScratch();});
  $('receiptDialog').addEventListener('close',()=>{if(!$('receiptDialog').open){clearTimeout(receiptPollTimer);state.receiptView=null;$('receiptBody').innerHTML='';}});
  if(typeof window.addEventListener==='function')window.addEventListener('beforeunload',e=>{if(state.stagedSending){e.preventDefault();e.returnValue='';}});
  /* BOOT */
  if(embeddedInSite())document.body.classList.add('embedded');
  (async()=>{try{const snapshot=await rpc('bootstrap');acceptSnapshot(snapshot);if(!state.me){clearLogin();if(snapshot.sessionError)notify(snapshot.sessionError,true);}render();}catch(e){$('app').innerHTML='<section class="card auth"><h1>尚未連線</h1><p id="initError"></p><p class="muted">請確認程式已儲存並更新部署版本。</p></section>';$('initError').textContent=e.message;}})();
  </script>
</body>
